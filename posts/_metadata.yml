# Shared front-matter for all posts
freeze: auto

author: "Alexey Tochin"

format:
  html:
    toc: true
    lightbox: true   # click a figure to open it full-screen and zoom
  pdf:
    toc: true
    number-sections: true
    colorlinks: true
    filters:
      - ../../_filters/pdf-equations.lua

# GitHub Discussions comments (giscus). Ids from the GitHub GraphQL API:
# repository.id and the discussion category's id. Needs a public repo.
comments:
  giscus:
    repo: alexeytochin/alexeytochin.github.io
    repo-id: "MDEwOlJlcG9zaXRvcnkzMTQ3OTMzMDQ="
    category: "Comments"
    category-id: "DIC_kwDOEsNdWM4DLrgC"
    mapping: pathname
    reactions-enabled: true
    theme: light
    language: en
